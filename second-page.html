<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <title>Kseniia – Toinen sivu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
      line-height: 1.6;
      background: #0f172a;
      color: #e5e7eb;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .card {
      background: #020617;
      border-radius: 0.75rem;
      padding: 1.2rem;
      margin-top: 1rem;
      border: 1px solid #1f2937;
    }
    nav {
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }
    footer {
      margin-top: 3rem;
      text-align: center;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">← Takaisin etusivulle</a>
  </nav>

  <header>
    <h1>Tämä on toinen sivu</h1>
    <p>Lisätty GitHub Pages -sivustolle.</p>
  </header>

  <section class="card">
    <p>
      Täällä voit esimerkiksi näyttää lisätietoja, projektin kuvauksen,
      portfolio-osuuden tai yhteystiedot.
    </p>
    <p>
      Voit muokata tätä sivua haluamallasi tavalla ja linkittää siihen
      muita osioita tulevaisuudessa.
    </p>
  </section>

  <footer>
    <p>Kseniia – portfolio</p>
  </footer>
</body>
</html>
